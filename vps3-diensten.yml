# VPS 3 — diensten: assistent-services en Keycloak.
# De services zijn alleen voor de integratielaag; Keycloak bereikt de browser
# via de reverse proxy op VPS 1 (id.<domein>).
#
#   docker compose -f vps3-diensten.yml --env-file .env up -d

name: oa-diensten

services:
  diensten:
    build: { context: ./bron, dockerfile: ../Dockerfile, target: diensten }
    image: oa/diensten:${OA_VERSIE:-0.2.0}
    restart: unless-stopped
    environment:
      DIENSTEN_DIENSTSLEUTEL: ${DIENSTEN_DIENSTSLEUTEL:?}
    ports:
      - "${PRIVAAT_ADRES:?}:4200:4200"

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_WACHTWOORD:?}
      POSTGRES_DB: keycloak
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_WACHTWOORD}
      KC_HOSTNAME: https://id.${DOMEIN:?}
      # Het beheerscherm is van buiten afgesloten (Caddyfile); je bereikt het
      # via een SSH-tunnel op http://localhost:8080/admin (zie INRICHTING.md).
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BEHEERDER:-beheer}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BEHEERDER_WACHTWOORD:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OA_BASIS_URL: https://oa.${DOMEIN}
      # Eerste wachtwoord van de testgebruikers; tijdelijk, bij de eerste
      # inlog kies je een eigen wachtwoord. installeer.sh maakt het willekeurig.
      OA_TESTWACHTWOORD: ${OA_TESTWACHTWOORD:?}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${PRIVAAT_ADRES}:8080:8080"
    depends_on:
      keycloak-db: { condition: service_healthy }

  # Sleutelbeheer: OpenBao, transit-engine, één sleutel per object (OA-ADR-008).
  # Bewust op een andere VPS dan de versleutelde gegevens. Eerste keer:
  # openbao/init.sh (initialiseren, ontzegelen, transit en token voor het platform).
  # Na elke herstart moet OpenBao opnieuw worden ontzegeld.
  sleutelbeheer:
    image: quay.io/openbao/openbao:${OPENBAO_VERSIE:-2.7.2}
    profiles: ["sleutels"]
    restart: unless-stopped
    # "server" laadt zelf alles uit /openbao/config; een extra -config zou
    # de listener dubbel laden.
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - baodata:/openbao/file
    ports:
      - "${PRIVAAT_ADRES}:8200:8200"

volumes:
  kcdata:
  baodata:
