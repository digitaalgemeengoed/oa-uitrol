# Redmine — Digitaal Gemeengoed. De waarden komen uit de omgeving (vps4-gemeenschap.yml).
production:
  email_delivery:
<% if ENV['SMTP_HOST'].to_s.empty? %>
    delivery_method: :test
<% else %>
    delivery_method: :smtp
    smtp_settings:
      address: <%= ENV['SMTP_HOST'] %>
      port: <%= ENV.fetch('SMTP_POORT', '587') %>
      enable_starttls_auto: true
      authentication: :login
      user_name: <%= ENV['SMTP_GEBRUIKER'].to_s.to_json %>
      password: <%= ENV['SMTP_WACHTWOORD'].to_s.to_json %>
<% end %>
  attachments_storage_path: /usr/src/redmine/files
